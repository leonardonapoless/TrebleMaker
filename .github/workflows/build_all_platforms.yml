name: Build TrebleMaker

on:
  push:
    branches:
      - main
      - 'fix/*'
      - 'feat/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # MACOS BUILD
  build_mac:
    name: Build macOS (VST3/LV2/AU/CLAP)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(grep "project(TrebleMaker VERSION" CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
          echo "PROJECT_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected Version: ${VERSION}"

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Stage Artifacts
        run: |
          mkdir -p staged_artifacts/VST3 staged_artifacts/LV2 staged_artifacts/AU staged_artifacts/CLAP
          find build -name "*.vst3" -exec cp -r {} staged_artifacts/VST3/ \;
          find build -name "*.lv2" -exec cp -r {} staged_artifacts/LV2/ \;
          find build -name "*.component" -exec cp -r {} staged_artifacts/AU/ \;
          find build -name "*.clap" -exec cp {} staged_artifacts/CLAP/ \;

      - name: Build Installer
        run: |
          chmod +x installer_macos.sh
          ./installer_macos.sh
          mv TrebleMaker_Installer.pkg TrebleMaker_macOS_Installer.pkg

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrebleMaker_macOS_Installer
          path: TrebleMaker_macOS_Installer.pkg

  # LINUX BUILD
  build_linux:
    name: Build Linux (VST3/LV2/CLAP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(grep "project(TrebleMaker VERSION" CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
          echo "PROJECT_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxtst-dev \
            libfreetype6-dev libfontconfig1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev libcurl4-openssl-dev \
            pkg-config ninja-build

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Stage Artifacts
        run: |
          mkdir -p staged_artifacts/VST3 staged_artifacts/LV2 staged_artifacts/CLAP
          find build -name "*.vst3" -exec cp -r {} staged_artifacts/VST3/ \;
          find build -name "*.lv2" -exec cp -r {} staged_artifacts/LV2/ \;
          find build -name "*.clap" -exec cp {} staged_artifacts/CLAP/ \;

      - name: Build Installer Package
        run: |
          cp installer_linux.sh staged_artifacts/
          chmod +x staged_artifacts/installer_linux.sh
          cd staged_artifacts
          zip -r ../TrebleMaker_Linux_Installer.zip ./*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrebleMaker_Linux_Installer
          path: TrebleMaker_Linux_Installer.zip

  # WINDOWS BUILD
  build_windows:
    name: Build Windows (VST3/LV2/CLAP)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep "project(TrebleMaker VERSION" CMakeLists.txt | sed 's/.*VERSION \([0-9.]*\).*/\1/')
          echo "PROJECT_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Stage Artifacts
        shell: bash
        run: |
          mkdir -p staged_artifacts/VST3 staged_artifacts/LV2 staged_artifacts/CLAP
          find build -name "*.vst3" -exec cp -r {} staged_artifacts/VST3/ \;
          find build -name "*.lv2" -exec cp -r {} staged_artifacts/LV2/ \;
          find build -name "*.clap" -exec cp {} staged_artifacts/CLAP/ \;

      - name: Build Installer
        shell: bash
        run: |
          iscc //DMyAppVersion=${{ steps.get_version.outputs.version }} installer_windows.iss

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrebleMaker_Windows_Installer
          path: Output/TrebleMaker_Windows_Installer.exe
  # RELEASE BUILD
  release:
    name: Create GitHub Release
    needs: [build_mac, build_linux, build_windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
